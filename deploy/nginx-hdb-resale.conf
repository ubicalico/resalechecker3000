# NGINX site for the HDB resale Flask app.
# Install as: /etc/nginx/sites-available/hdb-resale (symlinked into sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Compress the fairly large HTML tables
    gzip on;
    gzip_types text/html text/css application/json;

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/run/hdb-resale/uwsgi.sock;
        uwsgi_read_timeout 60s;
    }
}
