[uwsgi]
; Application
chdir = /srv/hdb-resale-app
module = wsgi:app
virtualenv = /srv/hdb-resale-app/venv

; Process model
master = true
processes = 4
threads = 2

; Socket shared with NGINX (created under /run/hdb-resale by systemd)
socket = /run/hdb-resale/uwsgi.sock
chmod-socket = 660
vacuum = true

; Make SIGTERM shut uWSGI down cleanly (plays nicely with systemd)
die-on-term = true
